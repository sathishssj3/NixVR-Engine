name: Package Setup.exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string
      publish_to_releases_repo:
        description: 'Publish Setup.exe to sathishssj3/NexVR-Engine-Releases'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
    paths-ignore:
      - 'nexvr-docs/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-setup:
    name: Build and Package Setup.exe
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[package]') || contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC & CMake
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Download Official DXC (for SPIR-V support)
        shell: cmd
        run: |
          curl.exe -L https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/dxc_2023_08_14.zip -o dxc.zip
          7z.exe x dxc.zip -odxc -y

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4-windows

      - name: Setup Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VulkanURL = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $VulkanURL -OutFile VulkanSDK.exe
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

      - name: Configure Vulkan Environment
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Dummy Models
        shell: pwsh
        run: |
          pip install onnx
          if (-not (Test-Path nexvr-client/models)) { mkdir nexvr-client/models }
          python nexvr-client/generate_dummy_onnx.py
          Copy-Item nexvr-client/models/dummy.onnx nexvr-client/models/depth_inpainter.onnx
          Copy-Item nexvr-client/models/dummy_ui.onnx nexvr-client/models/ui_synthesizer.onnx

      - name: Configure CMake
        run: cmake -B build -S . -A x64 -DDXC_EXECUTABLE="${{ github.workspace }}/dxc/bin/x64/dxc.exe"

      - name: Build Native Engine Targets (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Build shaders, then injection DLL, then CLI with parallel MSVC compilation
          cmake --build build --config Release --target copy_shaders_for_dx12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target vrinject -- /maxcpucount
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target vr-inject-cli -- /maxcpucount
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'nexvr-client/launcher/package-lock.json'

      - name: Install Launcher Dependencies
        working-directory: ./nexvr-client/launcher
        run: npm install

      - name: Build and Package Electron App (NSIS Installer)
        working-directory: ./nexvr-client/launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pack -- --publish never

      - name: Standardize Setup.exe Filenames
        shell: pwsh
        working-directory: ./nexvr-client/launcher/dist-electron
        run: |
          $setupFile = Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1
          if ($setupFile) {
            Write-Host "Discovered NSIS installer: $($setupFile.Name)"
            Copy-Item $setupFile.FullName "NexVR-Engine-Setup.exe" -Force
            Copy-Item $setupFile.FullName "NexVR.Engine.Setup.0.1.0.exe" -Force
            Write-Host "Created canonical download targets: NexVR-Engine-Setup.exe and NexVR.Engine.Setup.0.1.0.exe"
          } else {
            Write-Host "::error::No Setup.exe was found in dist-electron!"
            exit 1
          }

      - name: Upload Setup.exe as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVR-Engine-Setup
          path: |
            nexvr-client/launcher/dist-electron/NexVR-Engine-Setup.exe
            nexvr-client/launcher/dist-electron/NexVR.Engine.Setup.*.exe
            nexvr-client/launcher/dist-electron/NexVR Engine Setup*.exe
            nexvr-client/launcher/dist-electron/NexVR Engine Portable*.exe
            nexvr-client/launcher/dist-electron/*.zip
          retention-days: 30

      - name: Publish to NexVR-Engine Releases (Local Repo)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.1.0' }}
          files: |
            nexvr-client/launcher/dist-electron/NexVR-Engine-Setup.exe
            nexvr-client/launcher/dist-electron/NexVR.Engine.Setup.*.exe
            nexvr-client/launcher/dist-electron/NexVR Engine Portable*.exe
            nexvr-client/launcher/dist-electron/*.zip

      - name: Publish to NexVR-Engine-Releases Repo
        if: startsWith(github.ref, 'refs/tags/') || (inputs.publish_to_releases_repo == true)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets['RELEASES_REPO_TOKEN'] || '' }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Host "No RELEASES_REPO_TOKEN secret found. Skipping cross-repo release upload."
            exit 0
          }
          $tagToUse = if ($env:TAG) { $env:TAG } else { "v0.1.0" }
          $scriptPath = if (Test-Path ./nexvr-client/scripts/upload_to_releases_repo.ps1) { "./nexvr-client/scripts/upload_to_releases_repo.ps1" } else { "./scripts/upload_to_releases_repo.ps1" }
          & $scriptPath -Token $env:GH_TOKEN -Tag $tagToUse
